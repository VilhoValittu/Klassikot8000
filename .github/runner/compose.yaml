# GitHub Actions -runnerit minipc:llä (camilla@192.168.0.251, kansio ~/runner).
#   runner        tarkistukset ja Windows-paketti cargo-xwinillä (Debian 13), label minipc
#   runner-linux  Linux x86_64 -paketti (Ubuntu 22.04, vanha glibc), label minipc-linux
#
# Käyttöönotto: kopioi tämän kansion tiedostot (myös linux/) ja tulosavain (salaisuudet/tulosavain,
# oikeudet 600) minipc:lle ja käynnistä kumpikin kerran omalla rekisteröintitokenillaan, jonka saa
# komennolla
#   gh api -X POST repos/VilhoValittu/Klassikot8000/actions/runners/registration-token --jq .token
#   REKISTEROINTI=<token> docker compose up -d --build runner
#   REKISTEROINTI=<token> docker compose up -d --build runner-linux
# Myöhemmin riittää docker compose up -d --build (esim. Dockerfilen versioiden noston jälkeen).
#
# Suojaus: työt ajetaan tavallisena käyttäjänä ilman Docker-pääsyä ja ilman minipc:n tiedostoja.
# Ainoa liitetty salaisuus on tulosavain vain luettavana. Repon asetus vaatii hyväksynnän
# ulkopuolisten pull requestien töille.
services:
  runner:
    build: .
    image: klassikot-runner
    container_name: actions-runner
    restart: unless-stopped
    environment:
      REPO_URL: https://github.com/VilhoValittu/Klassikot8000
      REKISTEROINTI: ${REKISTEROINTI:-}
    volumes:
      - asetukset:/home/runner/asetukset
      - valimuisti:/home/runner/valimuisti
      - cargo-registry:/home/runner/.cargo/registry
      - ./salaisuudet/tulosavain:/run/salaisuudet/tulosavain:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Pi-hole ja muut palvelut pysyvät nopeina käännöksen aikana.
    cpus: 3
    mem_limit: 6g

  runner-linux:
    build:
      context: .
      dockerfile: linux/Dockerfile
    image: klassikot-runner-linux
    container_name: actions-runner-linux
    restart: unless-stopped
    environment:
      REPO_URL: https://github.com/VilhoValittu/Klassikot8000
      REKISTEROINTI: ${REKISTEROINTI:-}
      RUNNER_NAME: minipc-linux
      RUNNER_LABELS: minipc-linux
    volumes:
      - asetukset-linux:/home/runner/asetukset
      - valimuisti-linux:/home/runner/valimuisti
      - cargo-registry:/home/runner/.cargo/registry
      - ./salaisuudet/tulosavain:/run/salaisuudet/tulosavain:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Matala CPU-prioriteetti pitää Pi-holen ja muut palvelut nopeina käännöksen aikana.
    cpus: 3
    cpu_shares: 256
    mem_limit: 4g

volumes:
  asetukset:
  valimuisti:
  cargo-registry:
  asetukset-linux:
  valimuisti-linux:
