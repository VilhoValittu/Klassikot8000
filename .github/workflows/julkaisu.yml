# Tekee GitHub-julkaisun, kun versiotagi (v1.2.3) viedään GitHubiin: riittää git tag v1.2.3 ja
# git push origin v1.2.3 mainin kärjestä, tai julkaise.ps1. Jos versiota ei ole nostettu,
# nosta-versio.sh nostaa sen, vie noston mainiin ja siirtää tagin siihen.
# Ajetaan minipc:n runnerilla, jolla tulosavain on (.github/runner/compose.yaml).
# Varalla toimii edelleen paikallinen paketoi.ps1 -Julkaise.
# Testejä ei ajeta: ne on ajettu jo ennakkoon (tarkistukset.yml jokaisesta mainin muutoksesta).
name: Julkaisu

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: julkaisu

env:
  # Sama versio kuin tarkistukset.yml:ssä.
  RUSTUP_TOOLCHAIN: "1.95.0"
  CARGO_TERM_COLOR: always
  # Oma käännöskansio: avaimellinen exe ei sekoitu tarkistusten koekäännöksiin.
  CARGO_TARGET_DIR: /home/runner/valimuisti/target-julkaisu

jobs:
  julkaisu:
    runs-on: [self-hosted, minipc]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # Muutoslista tarvitsee edellisen tagin ja sen jälkeiset commitit.
          fetch-depth: 0

      - name: Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal -t x86_64-pc-windows-msvc

      - name: Versio tagin mukaiseksi
        run: bash .github/scripts/nosta-versio.sh "$GITHUB_REF_NAME"

      - name: Paketti
        run: bash .github/scripts/paketoi.sh --avain /run/salaisuudet/tulosavain

      - name: Julkaisu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tagi="$GITHUB_REF_NAME"
          bash .github/scripts/muutokset.sh "$tagi" > "$RUNNER_TEMP/muutokset.md"
          valinnat=(--verify-tag --title "Klassikot8000 $tagi" --notes-file "$RUNNER_TEMP/muutokset.md")
          if [[ "$tagi" == *-* ]]; then
            valinnat+=(--prerelease)
          fi
          gh release create "$tagi" "dist/klassikot8000-${tagi#v}-windows-x64.zip" "${valinnat[@]}"
