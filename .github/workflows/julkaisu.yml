# Versiotagi (esim. v0.3.5) kääntää paketit kaikille alustoille ja julkaisee ne muutoslistan kanssa.
# Käsin käynnistetty ajo tekee samat paketit mutta julkaisee vain, jos se käynnistetään tagista ja julkaisu valitaan.
#
# Jos jonkin alustan käännös epäonnistuu, muut paketit julkaistaan silti ja puuttuva alusta mainitaan julkaisutekstissä.
# Puuttuva paketti lisätään samaan julkaisuun painamalla ajossa "Re-run failed jobs".
# Jos GitHubin macOS-kone ei vapaudu ja työ jää jonoon: peruuta ajo ja käynnistä se käsin tagista valinnoilla
# "julkaise" ja "ohita macOS". Kun macOS-kone taas toimii, käynnistä ajo uudelleen pelkällä "julkaise"-valinnalla.
name: Julkaisu

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      julkaise:
        description: Julkaise paketit (ajo on käynnistettävä tagista)
        type: boolean
        default: false
      ohita_macos:
        description: Ohita macOS, jos GitHubin macOS-kone ei ole saatavilla
        type: boolean
        default: false

permissions:
  contents: read

env:
  # rust-toolchain.toml on lukittu Windowsin MSVC:hen, joka ei asennu muille alustoille.
  RUSTUP_TOOLCHAIN: stable

jobs:
  versio:
    runs-on: ubuntu-latest
    outputs:
      versio: ${{ steps.luku.outputs.versio }}
      kaikki: ${{ steps.alustat.outputs.kaikki }}
      alustat: ${{ steps.alustat.outputs.alustat }}
    steps:
      - uses: actions/checkout@v7
      - id: luku
        name: Lue versio ja vertaa tagiin
        env:
          JULKAISE: ${{ inputs.julkaise }}
        run: |
          versio=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "versio=$versio" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$versio" ]]; then
            echo "::error::Tagi $GITHUB_REF_NAME ei vastaa Cargo.tomlin versiota $versio"
            exit 1
          fi
          if [[ "$JULKAISE" == true && "$GITHUB_REF_TYPE" != tag ]]; then
            echo "::error::Julkaisu vaatii, että ajo käynnistetään tagista eikä haarasta $GITHUB_REF_NAME"
            exit 1
          fi
      - id: alustat
        name: Valitse alustat
        env:
          OHITA_MACOS: ${{ inputs.ohita_macos }}
        run: |
          # Vanhin saatavilla oleva Ubuntu, jotta Linux-paketti toimii myös vanhemman glibc:n koneissa.
          kaikki=$(jq -c . <<'JSON'
          [
            {"alusta": "linux-x64", "kone": "ubuntu-22.04"},
            {"alusta": "linux-arm64", "kone": "ubuntu-22.04-arm"},
            {"alusta": "macos-universal", "kone": "macos-latest", "kohteet": "x86_64-apple-darwin,aarch64-apple-darwin"},
            {"alusta": "windows-x64", "kone": "windows-latest"}
          ]
          JSON
          )
          alustat=$kaikki
          if [[ "$OHITA_MACOS" == true ]]; then
            alustat=$(jq -c 'map(select(.alusta != "macos-universal"))' <<< "$kaikki")
          fi
          echo "kaikki=$kaikki" >> "$GITHUB_OUTPUT"
          echo "alustat=$alustat" >> "$GITHUB_OUTPUT"

  paketti:
    needs: versio
    name: ${{ matrix.alusta }}
    runs-on: ${{ matrix.kone }}
    # Normaali ajo kestää alle 10 minuuttia; jumiin jäänyt kone ei saa pidätellä julkaisua tuntikausia.
    timeout-minutes: 30
    strategy:
      # Yhden alustan virhe ei saa peruuttaa muita, jotta kaikki virheet näkyvät samalla ajolla.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versio.outputs.alustat) }}
    env:
      VERSIO: ${{ needs.versio.outputs.versio }}
      ALUSTA: ${{ matrix.alusta }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.kohteet }}
      - name: Asenna Linuxin kehityspaketit
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Testit
        run: cargo test --locked

      - name: Paketoi Linux
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          nimi="klassikot8000-$VERSIO-$ALUSTA"
          mkdir -p "dist/$nimi"
          python3 paketointi/lisenssit.py "dist/$nimi/THIRD-PARTY-LICENSES.txt"
          cp target/release/klassikot8000 "dist/$nimi/klassikot8000-$VERSIO"
          cp kielet.txt LICENSE "dist/$nimi/"
          # Linuxin ohjelmatiedostossa ei voi olla ikonia, joten se tulee mukaan pikakuvaketta varten.
          cp paketointi/ikoni.png "dist/$nimi/klassikot8000.png"
          tar -C dist -czf "dist/$nimi.tar.gz" "$nimi"
          rm -r "dist/$nimi"

      - name: Paketoi macOS
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          sovellus="dist/Klassikot8000-$VERSIO.app"
          sisalto=$sovellus/Contents
          mkdir -p "$sisalto/MacOS" "$sisalto/Resources"
          cp paketointi/ikoni.icns LICENSE "$sisalto/Resources/"
          python3 paketointi/lisenssit.py "$sisalto/Resources/THIRD-PARTY-LICENSES.txt" x86_64-apple-darwin aarch64-apple-darwin
          lipo -create -output "$sisalto/MacOS/klassikot8000" \
            target/x86_64-apple-darwin/release/klassikot8000 \
            target/aarch64-apple-darwin/release/klassikot8000
          lipo -archs "$sisalto/MacOS/klassikot8000"
          sed "s/VERSIO/$VERSIO/g" paketointi/Info.plist > "$sisalto/Info.plist"
          # Apple Silicon ei aja allekirjoittamatonta ohjelmaa lainkaan, joten paikallinen allekirjoitus on pakollinen.
          codesign --force --sign - "$sovellus"
          ditto -c -k --keepParent "$sovellus" "dist/klassikot8000-$VERSIO-$ALUSTA.zip"
          rm -r "$sovellus"

      - name: Paketoi Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File paketoi.ps1

      - name: Tarkista koko
        shell: bash
        run: |
          # Paketin on pysyttävä alle 10 Mt:n.
          for paketti in dist/*; do
            koko=$(wc -c < "$paketti")
            echo "$paketti: $koko tavua"
            test "$koko" -lt 10000000
          done
      - uses: actions/upload-artifact@v7
        with:
          # Ladattavan artefaktin nimessäkin on versio.
          name: klassikot8000-${{ needs.versio.outputs.versio }}-${{ matrix.alusta }}
          path: dist/*
          if-no-files-found: error

  julkaisu:
    needs: [versio, paketti]
    # Ajetaan, vaikka osa alustoista epäonnistui, jotta yhden alustan ongelma ei estä muiden julkaisua.
    if: >-
      ${{ !cancelled() && needs.versio.result == 'success' && github.ref_type == 'tag'
      && (github.event_name == 'push' || inputs.julkaise) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAGI: ${{ github.ref_name }}
      VERSIO: ${{ needs.versio.outputs.versio }}
      KAIKKI: ${{ needs.versio.outputs.kaikki }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Muutoslista tarvitsee koko historian ja edellisen tagin.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Tee muutoslista
        run: bash .github/scripts/muutokset.sh "$TAGI" > muutokset.md
      - name: Tarkista puuttuvat alustat
        run: |
          mkdir -p dist
          shopt -s nullglob
          paketit=(dist/*)
          if (( ${#paketit[@]} == 0 )); then
            echo "::error::Yhtään pakettia ei syntynyt, joten julkaistavaa ei ole"
            exit 1
          fi
          # Aiemmalla ajolla julkaistu paketti ei puutu, vaikka sitä ei käännetty tällä kertaa.
          loytyy=$(ls dist; gh release view "$TAGI" --json assets --jq '.assets[].name' 2> /dev/null || true)
          puuttuvat=()
          for alusta in $(jq -r '.[].alusta' <<< "$KAIKKI"); do
            if ! grep -qF -- "-$VERSIO-$alusta." <<< "$loytyy"; then
              puuttuvat+=("$alusta")
              echo "::warning::$alusta-paketti puuttuu julkaisusta"
            fi
          done
          if (( ${#puuttuvat[@]} > 0 )); then
            luettelo=$(printf '%s, ' "${puuttuvat[@]}")
            {
              printf '> **Huom.** Näiden alustojen paketit puuttuvat vielä ja lisätään myöhemmin: %s\n\n' "${luettelo%, }"
              cat muutokset.md
            } > muutokset.uusi
            mv muutokset.uusi muutokset.md
          fi
      - name: Julkaise
        run: |
          # Uudelleenajo korvaa epäonnistuneen ajon jäljet ja lisää puuttuneet paketit.
          if gh release view "$TAGI" > /dev/null 2>&1; then
            gh release edit "$TAGI" --notes-file muutokset.md
            gh release upload "$TAGI" dist/* --clobber
          else
            esiversio=()
            if [[ "$TAGI" == *-* ]]; then
              esiversio=(--prerelease)
            fi
            gh release create "$TAGI" dist/* --verify-tag --title "Klassikot8000 $TAGI" --notes-file muutokset.md "${esiversio[@]}"
          fi
