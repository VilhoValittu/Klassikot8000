name: Publish release package

# Kutsutaan jokaisesta release-<alusta>.yml:stä paketin rakentamisen jälkeen. Lisää sen yhden
# paketin tagin GitHub-julkaisuun ja luo julkaisun, jos paketti on ensimmäinen. Olemassa olevan
# julkaisun muut paketit säilyvät, myös julkaise.bat --paikallinen -valinnalla tehdyt.
# Julkaisutiedote tehdään commit-viesteistä edellisestä versiotagista (.github/scripts/muutokset.sh).
on:
  workflow_call:
    inputs:
      tag:
        description: "Versiotagi, esim. v0.6.0"
        required: true
        type: string
      artifact:
        description: "upload-artifactin nimi, jossa paketti on"
        required: true
        type: string
      asset_suffix:
        description: "Paketin nimen loppu päätteineen: klassikot8000-<versio>-<suffix>, esim. linux-x64.tar.gz"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  publish:
    name: Julkaisu ${{ inputs.asset_suffix }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          # Muutoslista tarvitsee edellisen tagin ja sen jälkeiset commitit.
          fetch-depth: 0

      - name: Versio tagista
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Tagin on oltava muotoa v1.2.3, nyt: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: artifacts

      - name: Paketin tarkistus
        env:
          ASSET_SUFFIX: ${{ inputs.asset_suffix }}
        run: |
          odotettu="klassikot8000-${VERSION}-${ASSET_SUFFIX}"
          loydetyt=$(find artifacts -type f -printf '%f\n' | sort)
          if [[ "$loydetyt" != "$odotettu" ]]; then
            printf 'Artifaktissa piti olla vain %s, löytyi:\n%s\n' "$odotettu" "$loydetyt" >&2
            exit 1
          fi

      - name: Julkaisutiedote
        run: bash .github/scripts/muutokset.sh "$RELEASE_TAG" > "$RUNNER_TEMP/muutokset.md"

      - name: GitHub-julkaisu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t paketit < <(find artifacts -type f | sort)
          printf 'Julkaistaan %s\n' "${paketit[@]}"
          paivita() {
            gh release upload "$RELEASE_TAG" "${paketit[@]}" --clobber
            gh release edit "$RELEASE_TAG" --title "Klassikot8000 $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/muutokset.md"
          }
          # Olemassa oleva julkaisu säilytetään: siinä voi olla muiden ajojen paketteja.
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            paivita
            exit 0
          fi
          if ! gh release create "$RELEASE_TAG" "${paketit[@]}" --verify-tag \
              --title "Klassikot8000 $RELEASE_TAG" --notes-file "$RUNNER_TEMP/muutokset.md"; then
            # Toinen ajo loi julkaisun samalla hetkellä.
            sleep 10
            gh release view "$RELEASE_TAG" > /dev/null
            paivita
          fi
