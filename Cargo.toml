[package]
name = "klassikot8000"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
minifb = { version = "0.29.0", default-features = false }
tinyaudio = "2.0.0"
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }

# Linuxissa ikkuna tarvitsee X11:n, joka toimii myös Waylandissa XWaylandin kautta. OpenSSL
# käännetään mukaan, koska sen versio vaihtelee jakeluittain.
[target.'cfg(target_os = "linux")'.dependencies]
minifb = { version = "0.29.0", default-features = false, features = ["x11"] }
native-tls = { version = "0.2", features = ["vendored"] }

# minifb 0.29:n build.rs etsii kohteesta sanaa "-macos", vaikka kohde on "-apple-darwin", ja
# kaatuu ilman tätä ominaisuutta. macOS:ssä se ei tuo mukaan X11:tä eikä muuta koodia.
[target.'cfg(target_os = "macos")'.dependencies]
minifb = { version = "0.29.0", default-features = false, features = ["x11"] }

# Piirto on ohjelman raskain työ: nopeusoptimointi kasvattaa exeä noin 400 kt, mutta pitää
# paketin selvästi alle 10 Mt:n rajan.
# Testit piirtävät tuhansia kuvia: kevyt optimointi lyhentää testiajon muutoksen jälkeen noin
# 90 sekunnista noin 15:een. Tarkistukset (debug_assertions, ylivuodot) pysyvät päällä.
[profile.test]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Riippuvuudet kokooptimoidaan: verkkokirjastot ajetaan omassa säikeessään muutaman kerran
# käynnistyksessä, joten nopeus ei näy pelissä, ja paketti pienenee noin 30 kt. Ikkuna ja ääni
# ovat joka ruudussa mukana, joten ne pysyvät nopeusoptimoituina. Oma koodi ei kuulu "*":iin.
[profile.release.package."*"]
opt-level = "s"

[profile.release.package.minifb]
opt-level = 3

[profile.release.package.tinyaudio]
opt-level = 3
